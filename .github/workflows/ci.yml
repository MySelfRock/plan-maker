name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn workspace @planmaker/api lint

      - name: Type check
        run: yarn workspace @planmaker/api type-check

      - name: Run tests
        run: yarn workspace @planmaker/api test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret
          GEMINI_API_KEY: test-key

      - name: Build
        run: yarn workspace @planmaker/api build

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        run: yarn workspace @planmaker/frontend lint

      - name: Build frontend
        run: yarn workspace @planmaker/frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
